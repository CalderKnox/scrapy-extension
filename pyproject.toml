[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[project]
name = "scrapy-extension"
version = "0.1.0"
description = "Distributed crawling for Scrapy with ten pluggable queue, deduplication, and storage backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "azwpayne", email = "paynewu0719@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "scrapy",
    "crawler",
    "distributed",
    "redis",
    "mongodb",
    "kafka",
    "rabbitmq",
    "elasticsearch",
    "rocketmq",
    "pulsar",
    "sqs",
    "memcached",
    "dynamodb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Scrapy",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    # Scrapy's TLS identity chain reaches pyasn1 through service-identity.
    # 0.6.4 fixes CVE-2026-59884/59885/59886 decoder DoS flaws; 0.6.5 adds
    # fixes for CVE-2026-119194..119197 (quadratic-time BER/DER decoding).
    "pyasn1>=0.6.5,<0.7",
    "pydantic>=2.13.4,<3",
    # Pinned tightly: settings/_redacted.py's source-delegation façade
    # (_sync_wrapped_source_state) calls two private pydantic-settings
    # methods (_set_current_state/_set_settings_sources_data). Minor releases
    # may rename private internals without notice; bump only together with
    # that façade and its import-time surface smoke test.
    "pydantic-settings>=2.15.0,<2.17",
    # Scrapy currently permits Protego 0.6.0, which has a ReDoS vulnerability.
    # Keep the transitive dependency on the patched release line.
    "protego>=0.6.2,<0.8",
    "scrapy>=2.17.0,<3",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://github.com/azwpayne/scrapy-extension"
Repository = "https://github.com/azwpayne/scrapy-extension"
Issues = "https://github.com/azwpayne/scrapy-extension/issues"
Changelog = "https://github.com/azwpayne/scrapy-extension/blob/main/.github/CHANGELOG.md"

[project.optional-dependencies]
# NOTE: Backends use PEP 562 lazy imports — deps are loaded on demand.
redis = ["redis>=8.1.0,<9"]
mongodb = ["pymongo>=4.8.0,<5"]
kafka = ["kafka-python-ng>=2.2.2,<3"]
rabbitmq = ["pika>=1.4.4,<2"]
elasticsearch = ["elasticsearch>=9.4.1,<10"]
rocketmq = ["rocketmq-python-client>=5.1.1,<6"]
pulsar = ["pulsar-client>=3.13.0,<4"]
# Experimental — supply-chain caveat: pymemcache is unmaintained (last release
# 2022-10-17, ~1300+ days stale). The `memcached` extra is storage-only (KV+TTL).
# See .github/STABILITY.md "Memcached" row for status; tracked as U20.
memcached = ["pymemcache>=4.0,<5"]
sqs = ["boto3>=1.43.72,<2"]
dynamodb = ["boto3>=1.43.72,<2"]
all = [
    "redis>=8.1.0,<9",
    "pymongo>=4.8.0,<5",
    "kafka-python-ng>=2.2.2,<3",
    "pika>=1.4.4,<2",
    "elasticsearch>=9.4.1,<10",
    "rocketmq-python-client>=5.1.1,<6",
    "pulsar-client>=3.13.0,<4",
    "pymemcache>=4.0,<5",
    "boto3>=1.43.72,<2",
]

[dependency-groups]
# dev is the minimal local environment: lint/type-check tooling plus the task
# runner. It intentionally does not include the test group or the audit group,
# so a default sync stays free of backend SDKs, pytest, and deptry (deptry has
# no free-threaded wheel). The test group remains self-contained for an
# extracted sdist. Keep explicit version ranges here so `uv lock --upgrade`
# cannot cross major boundaries without review.
dev = [
    { include-group = "lint" },
    "packaging>=26.0,<27",
    "poethepoet",
]
lint = ["ruff>=0.16,<0.18", "bandit[toml]", { include-group = "typecheck" }]
typecheck = ["pyrefly>=1.4,<2"]
audit = ["deptry>=0.25,<0.26"]

test = [
    "packaging>=26.0,<27",
    "pytest",
    # Referenced by the root collection gate and warning policy, so the test
    # group must be independently runnable from an extracted sdist.
    "pytest-benchmark>=5.2.3",
    "pytest-xdist[psutil]",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-mock",
    "pytest-cov",
    "coverage[toml]",
    "pytest-sugar",
    "pytest-instafail",
    "pytest-socket",
    "hypothesis>=6.165.9,<7",
    # Tests import yaml directly. bandit used to provide PyYAML transitively,
    # but bandit is dev-only now, so declare it to keep this group
    # self-contained.
    "pyyaml>=6.0,<7",
    # Backend deps — tests import backend modules directly, which triggers
    # the module-level lazy-import guard. All backends must be installable
    # for the test suite to collect.
    "redis>=8.1.0,<9",
    "pymongo>=4.8.0,<5",
    "kafka-python-ng>=2.2.2,<3",
    "pika>=1.4.4,<2",
    "elasticsearch>=9.4.1,<10",
    # apache rocketmq-python-client is pure-Python (gRPC + protobuf, no native
    # lib) — installable in the test env without the librocketmq pain that
    # blocked the old ctypes client. Required so the lazy-import guard in
    # backends/rocketmq.py lets module collection succeed.
    "rocketmq-python-client>=5.1.1,<6",
    "pulsar-client>=3.13.0,<4",
    "pymemcache>=4.0,<5",
    "boto3>=1.43.72,<2",
    { include-group = "typecheck" },
]

[tool.uv]
default-groups = ["dev", "test"]
# Security floors for transitive dependencies that `uv audit --locked` treats
# as fatal. These keep a future re-resolve from silently reintroducing a
# vulnerable version; each floor is the first release with the advisory fix.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "brotli>=1.2.1",
    "brotlicffi>=1.2.1.0",
    "certifi>=2026.10.18",
    "dnspython>=2.9.0",
    "filelock>=4.2.1",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pymongo>=4.18.3",
    "setuptools>=84.1.0",
    "twisted>=26.10.0",
    "urllib3>=2.8.0",
]

[tool.deptry]
# src layout: the package is imported as `scrapy_extension`, never as the
# distribution name; examples are runnable scripts, not installed deps.
known_first_party = ["scrapy_extension", "examples"]
extend_exclude = ["conftest\\.py"]

[tool.deptry.package_module_name_map]
# Distribution name -> importable module name(s) where they differ. boto3 ships
# botocore, kafka-python-ng is imported as `kafka`, pymongo ships `bson`,
# pulsar-client is imported as `pulsar`, and rocketmq-python-client as
# `rocketmq`.
boto3 = ["boto3", "botocore"]
kafka-python-ng = "kafka"
pymongo = ["pymongo", "bson"]
pulsar-client = "pulsar"
rocketmq-python-client = "rocketmq"

[tool.deptry.per_rule_ignores]
# DEP003 (transitive dependency): scrapy/pydantic provide these imports; they
# are intentionally not declared as direct dependencies.
DEP003 = ["twisted", "pydispatch", "pydantic_core", "itemadapter"]
# DEP002 (unused dependency): security floors for transitive dependencies that
# `uv audit --locked` treats as fatal; they are intentionally not imported.
DEP002 = ["pyasn1", "protego"]
# DEP004 (dev dependency imported by non-dev code): packaging is CI/test-only
# tooling used by tools/check_audit_waiver.py, which runs against the lock.
DEP004 = ["packaging"]

[tool.uv.build-backend]
source-include = [
    ".github/audit-fixtures/**",
    ".github/audit-waivers.toml",
    ".github/CHANGELOG.md",
    ".github/CONTRIBUTING.md",
    ".github/SECURITY.md",
    ".github/STABILITY.md",
    ".github/workflows/**",
    "conftest.py",
    "docs/**",
    "examples/**",
    "tests/**",
    "tools/**",
    "uv.lock",
]
source-exclude = [
    # uv-build's explicit source includes are broader than .gitignore. Keep
    # workstation state, local databases, and internal scratch plans out of a
    # release even when a maintainer builds from a dirty checkout.
    "**/.claude/**",
    "**/.claude-flow/**",
    "**/.omc/**",
    "**/.env*",
    "**/.secrets/**",
    "**/credentials/**",
    "**/secrets/**",
    "**/*.pem",
    "**/*.key",
    "**/*.crt",
    "**/*.cer",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.keystore",
    # Coverage, test, type-checker, and tool caches/reports.
    "**/.coverage",
    "**/.coverage.*",
    "**/.benchmarks/**",
    # Keep this project-rooted: isolated uv_build extracts the sdist below its
    # own ~/.cache path, so **/.cache/** would exclude the wheel payload itself.
    "./.cache/**",
    "**/.hypothesis/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/__pycache__/**",
    "**/coverage.json",
    "**/coverage.xml",
    "**/htmlcov/**",
    "**/reports/**",
    # Local runtime state and generated packaging canaries.
    "**/*.db",
    "**/*.db-*",
    "**/*.log",
    "**/*.sqlite",
    "**/*.sqlite-*",
    "**/*.sqlite3",
    "**/*.sqlite3-*",
    "**/local-settings.*",
    "**/local_settings.py",
    "**/generated-canary*/**",
    "**/.packaging-canary*/**",
    "**/.DS_Store",
    # Historical working notes and archived audits are useful in Git but are
    # not user-facing package documentation.
    "docs/08-archive/**",
]

[tool.poe]
executor.type = "uv"
tasks.full = ["check", "audit"]
tasks.check = ["format-check", "lint-check", "type-check", "security-check"]
tasks.test = [
    "test-py311",
    "test-py312",
    "test-py313",
    "test-py314",
    "test-py314t"
]

# Verification tasks never edit the worktree. Use the explicit *-fix tasks to
# apply mechanical changes locally.
tasks.format-check = "ruff format --check src tests conftest.py"
tasks.format-fix = "ruff format src tests conftest.py"
tasks.lint-check = "ruff check"
tasks.lint-fix = "ruff check --fix --unsafe-fixes"
tasks.type-check = "pyrefly check src"
tasks.security-check = "bandit -r src -c pyproject.toml"
# Dependency hygiene is a separate task because it is slower and currently not
# part of the default `poe check` aggregate.
tasks.audit = { shell = "uvx deptry==0.25.1 ." }

# Keep the existing entry points, but make them safe read-only aliases.
tasks.format = ["format-check"]
tasks.lint = ["lint-check"]

tasks.test-py311 = { shell = "uv run --python 3.11 --group test pytest" }
tasks.test-py312 = { shell = "uv run --python 3.12 --group test pytest" }
tasks.test-py313 = { shell = "uv run --python 3.13 --group test pytest" }
tasks.test-py314 = { shell = "uv run --python 3.14 --group test pytest" }
# Free-threaded build. NOTE: lxml (pulled transitively by scrapy via parsel)
# re-enables the GIL on import, so this verifies 3.14t interpreter-compat —
# NOT GIL-free concurrency. True free-threading can't be exercised while
# scrapy depends on lxml (R81).
tasks.test-py314t = { shell = "uv run --python 3.14t --group test pytest" }

tasks.clean = { shell = """
	rm -rf .pytest_cache htmlcov .coverage coverage.xml .ruff_cache .benchmarks reports
	find . -type d -name __pycache__ -exec rm -rf {} +
	find . -type f -name "*.pyc" -delete
""" }

[tool.ruff]
# Runtime floor is >=3.11, but keep the lint target at py310 for this change:
# py311 raises 76 pre-existing UP017/UP035/UP042 findings, and some (UP042
# StrEnum) change test-fixture semantics. Modernize them in a dedicated change.
target-version = "py310"
src = ["src", "tests"]
exclude = ["examples"]

[tool.ruff.lint]
select = ["B", "F", "I", "RUF", "UP"]
extend-select = ["C4", "S", "PT"]
ignore = [
    "B009",
    "B904",
    "RUF043",
    "RUF059",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = [
    "S101",  # invariant asserts; Bandit B101 is globally skipped
    "S110",  # playbook:477-483 logging-handler isolation is intentional
]
"tests/**/*.py" = [
    "F811", "F841", "RUF012",
    "S101", "S102", "S104", "S105", "S106", "S108", "S110", "S311",
    "S603", "S607",
    "PT011", "PT012", "PT017",
]

[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py", "*_test.py", "testing.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "it_*", "its_*", "check_*"]
pythonpath = ["src", "."]
testpaths = ["tests", "src"]
addopts = [
    "--strict-config",
    "--disable-socket",
]
strict_markers = true
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "error::UserWarning", # 将警告视为错误
    # Remote plaintext compatibility warnings are exercised explicitly in
    # test_remote_plaintext_transition.py. Suppress duplicate expected warnings
    # from unrelated backend fixtures so new warning classes remain visible.
    "ignore:Remote unauthenticated plaintext .* connections are deprecated:FutureWarning:scrapy_extension\\.settings\\._transport_security",
    # itemadapter 0.13.1 imports pydantic.v1 only to recognise legacy item
    # models. Pydantic emits this warning on 3.14 even when the application
    # exclusively uses Pydantic v2. Keep the exemption exact by message and
    # stacklevel-reported importer module; every other UserWarning stays fatal.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:itemadapter\\._imports",
    # xdist disables benchmarks during pytest_configure; keep that one expected
    # plugin warning from becoming an INTERNALERROR. This must follow the broad
    # UserWarning rule because the last matching filter takes precedence.
    "ignore:Benchmarks are automatically disabled because xdist plugin is active:pytest_benchmark.logger.PytestBenchmarkWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
]
markers = [
    # `unit` and `e2e` are descriptive labels on selected contracts, not
    # complete tiers. CI selects the complete broker tier by integration mark
    # and treats everything else as the socket-blocked default suite.
    "unit: descriptive label on selected isolated tests; not a complete tier",
    "integration: complete live-broker tier under tests/integration",
    "e2e: descriptive label on selected end-to-end contracts; not a complete tier",
    "benchmark: opt-in pytest-benchmark measurements",
    "reference_model: local model checks with no production backend evidence",
]
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
precision = 2
# CI reads coverage.json and independently gates statement and branch rates;
# coverage.py's combined percentage would hide which contract regressed.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "reports/coverage"
title = "Coverage Report"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # 跳过assert检查（pytest使用大量assert）

[tool.pytest-watcher]
now = true
patterns = ["*.py", "*.toml"]
ignore_patterns = ["*.pyc", "__pycache__/*", "reports/*"]

[tool.pyrefly]
# Migrated from mypy --strict (U8, the py.typed public promise).
# `legacy` mirrors mypy's handling of untyped third-party imports
# (replace-untyped-imports-with-any = ["*"]) and keeps existing
# `# type: ignore[...]` comments effective while call sites migrate.
# check-unannotated-defs restores mypy's check_untyped_defs, which the
# legacy preset disables; infer-return-types = "never" mirrors mypy's
# refusal to infer unannotated return types.
preset = "legacy"
python-version = "3.11"
project-includes = ["src"]
check-unannotated-defs = true
infer-return-types = "never"
ignore-missing-imports = ["*"]

[tool.pyrefly.errors]
# Equivalent of the mypy strict flags this migration preserves:
# disallow_untyped_defs / disallow_incomplete_defs (parameter side),
# disallow_any_generics, warn_return_any, warn_unused_ignores, and
# warn_redundant_casts.
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
unannotated-return = "error"
no-any-return = "error"
redundant-cast = "warn"
unused-type-ignore = "error"
